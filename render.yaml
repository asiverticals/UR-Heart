services:
  - type: web
    name: ur-heart-sanctuary-api
    env: python
    plan: free
    region: singapore
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: ur-heart-media
      - key: R2_PUBLIC_DOMAIN
        value: https://media.urheart.app
      - key: FIREBASE_PROJECT_ID
        value: ur-heart-99d1d
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_B64
        sync: false
      - key: FIREBASE_WEB_API_KEY
        value: AIzaSyCC-w3SaTg17DgAYH4dNLDYqwPGJ5uD6cU
      - key: GOOGLE_SERVER_CLIENT_ID
        value: 336810105655-web.apps.googleusercontent.com
      - key: RESEND_FROM
        value: "UR-Heart Sanctuary <verify@urheart.app>"
      - key: SMTP_FROM
        value: "UR-Heart Sanctuary <verify@urheart.app>"
      - key: WS_BASE_URL
        value: wss://urheart.app/ws/chat
      - key: SUPERADMIN_SECRET_KEY
        generateValue: true

